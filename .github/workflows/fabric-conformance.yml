name: Fabric Conformance

on:
  push:
    branches: [main]
    paths:
      - 'site/api/v1/fabric.js'
      - 'tools/gc-fabric'
      - 'tools/fabric-conformance.mjs'
      - 'tools/scope-diff.mjs'
      - 'tools/scope-preflight.mjs'
      - 'tools/scope-envelope.mjs'
      - 'test/scope-diff.test.mjs'
      - 'test/fixtures/scope-*'
      - '.github/workflows/fabric-conformance.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  issues: write

jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify repository fabric contract
        run: node tools/fabric-conformance.mjs source

  scope-contract-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify ScopeSentinel drift semantics
        run: node --test test/scope-diff.test.mjs

  scope-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify ScopeSentinel remains directly usable during registry drift
        run: |
          set -e
          node tools/gc-fabric capabilities scope > /tmp/scope-capabilities.json
          node -e "const x=require('/tmp/scope-capabilities.json');if((x.api||x.contract)!=='glasscastles.scopesentinel.agent-api.v1')process.exit(1);if(x.network_requests!==false)process.exit(2);console.log('Scope bootstrap OK')"

  scope-api-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Allow structured scoped host with rate constraint
        run: |
          set -e
          node tools/scope-preflight.mjs --program Demo --policy test/fixtures/scope-policy.txt --scope test/fixtures/scope-structured.json --host api.example.com --action automation > /tmp/allow.json
          node -e "const x=require('/tmp/allow.json');if(x.decision?.decision!=='ALLOW')process.exit(1);const r=x.decision?.constraints?.[0];if(!r||r.limit!==100||r.period!=='minute')process.exit(2);console.log('ALLOW + 100/min constraint OK')"
      - name: Block explicit excluded host
        run: |
          set -e
          node tools/scope-preflight.mjs --program Demo --policy test/fixtures/scope-policy.txt --scope test/fixtures/scope-structured.json --host admin.example.com > /tmp/block.json
          node -e "const x=require('/tmp/block.json');if(x.decision?.decision!=='BLOCK')process.exit(1);console.log('Explicit exclusion BLOCK OK')"
      - name: Execution envelope never auto-asserts authorization
        run: |
          set -e
          node tools/scope-envelope.mjs --program Demo --policy test/fixtures/scope-policy.txt --scope test/fixtures/scope-structured.json --host api.example.com --action automation --max-requests 6 > /tmp/envelope.json
          node -e "const x=require('/tmp/envelope.json');const e=x.envelope?.envelope||x.envelope;if(!e||e.authorized!==false)process.exit(1);if(e.scope_state!=='clear')process.exit(2);if(Number(e.max_requests||e.request_budget||0)>6)process.exit(3);console.log('Fail-closed execution envelope OK')"

  public-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify live registry and stage capabilities
        run: node tools/fabric-conformance.mjs public

  drift-ledger:
    if: always()
    needs: [source-contract, scope-contract-tools, scope-bootstrap, scope-api-smoke, public-contract]
    runs-on: ubuntu-latest
    steps:
      - name: Reconcile production drift issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SOURCE_RESULT: ${{ needs.source-contract.result }}
          SCOPE_TOOLS_RESULT: ${{ needs.scope-contract-tools.result }}
          BOOTSTRAP_RESULT: ${{ needs.scope-bootstrap.result }}
          SCOPE_API_RESULT: ${{ needs.scope-api-smoke.result }}
          PUBLIC_RESULT: ${{ needs.public-contract.result }}
        run: |
          set -e
          if [ "$SOURCE_RESULT" = "success" ] && [ "$SCOPE_TOOLS_RESULT" = "success" ] && [ "$BOOTSTRAP_RESULT" = "success" ] && [ "$SCOPE_API_RESULT" = "success" ] && [ "$PUBLIC_RESULT" = "success" ]; then
            gh issue close 1 --repo "$REPO" --reason completed --comment "Fabric Conformance is fully green. Canonical source and public six-stage fabric now agree. Auto-closing drift ledger from run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true
          else
            gh issue reopen 1 --repo "$REPO" || true
          fi

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="GlassCastle(Q) Query Disector identifies query languages and explains query anatomy, syntax, and semantics.">
  <meta name="theme-color" content="#0b0d10">
  <title>GlassCastle(Q) · Query Disector</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="GlassCastle Q Query Disector">
        <span class="brand-mark">Q</span>
        <span class="brand-text"><strong>GlassCastle(Q)</strong><span>Query Disector</span></span>
      </a>
      <div class="topbar-status"><span class="status-dot"></span>Runs locally in your browser <span class="version">v0.4</span></div>
    </header>

    <main class="workspace">
      <section class="query-workspace" aria-label="Query input">
        <div class="query-toolbar">
          <div class="toolbar-controls">
            <label class="select-control">
              <span class="sr-only">Input language</span>
              <select id="language"><option value="auto">Auto detect language</option></select>
            </label>
            <label class="select-control secondary-control">
              <span class="sr-only">Example query</span>
              <select id="sample">
                <option value="">Examples</option>
                <option value="spl">Splunk SPL</option>
                <option value="esql">Elastic ES|QL</option>
                <option value="kusto">Microsoft KQL / Kusto</option>
                <option value="cql">CrowdStrike CQL / LogScale</option>
                <option value="sql">SQL</option>
              </select>
            </label>
          </div>
          <div class="toolbar-actions">
            <button class="text-button" id="copy-query" type="button">Copy</button>
            <button class="text-button" id="clear-query" type="button">Clear</button>
            <button class="primary-button" id="analyze" type="button">Dissect query</button>
          </div>
        </div>

        <div class="editor-shell">
          <div class="editor-body">
            <pre id="line-numbers" class="line-numbers" aria-hidden="true">1</pre>
            <textarea id="query" spellcheck="false" aria-label="Query input">index=zeek service=ssl
| stats count by id.orig_h
| sort -count</textarea>
          </div>
          <div class="editor-meta">
            <span id="query-metrics">0 lines · 0 chars</span>
            <span id="cursor-position">Ln 1, Col 1</span>
            <span class="keyboard-hint">⌘/Ctrl ↵ to dissect</span>
          </div>
        </div>

        <div id="status" class="status-line" aria-live="polite"></div>
        <div id="selection-prompt" class="selection-prompt" hidden></div>
      </section>

      <section class="result-shell" id="output" aria-label="Query dissection">
        <header class="result-header">
          <div class="result-heading">
            <div class="language-line">
              <span id="detected-language">—</span>
              <span class="confidence-inline"><span id="confidence-bar"></span></span>
              <span id="confidence">—</span>
            </div>
            <h1>Query dissection</h1>
          </div>
          <div class="result-metadata">
            <span><b>Family</b><strong id="family">—</strong></span>
            <span><b>Parser</b><strong id="selected-dissector">—</strong></span>
          </div>
        </header>

        <div class="result-layout">
          <nav class="section-nav" aria-label="Dissection views">
            <button class="active" data-tab="review" type="button"><span>Overview</span><small>What it does</small></button>
            <button data-tab="anatomy" type="button"><span>Anatomy</span><small>Parts of the query</small></button>
            <button data-tab="syntax" type="button"><span>Syntax</span><small>Grammar & structure</small></button>
            <button data-tab="semantics" type="button"><span>Semantics</span><small>Meaning & effect</small></button>
          </nav>

          <div class="result-content">
            <div class="panel active-panel" id="review"></div>
            <div class="panel" id="anatomy" hidden></div>
            <div class="panel" id="syntax" hidden></div>
            <div class="panel" id="semantics" hidden></div>
          </div>
        </div>

        <details class="language-details">
          <summary>Language detection details</summary>
          <div class="language-details-grid">
            <section>
              <h2>Evidence</h2>
              <ul id="evidence" class="evidence-list"></ul>
            </section>
            <section>
              <h2>Other possible matches</h2>
              <div class="alternatives" id="alternatives"></div>
            </section>
          </div>
        </details>
      </section>
    </main>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
